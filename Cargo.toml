[package]
name = "mentpy-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "_rust"
path = "mentpy/_native/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["abi3-py310"] }
petgraph = "0.8"
candle-core = "0.11.1"
gemm = "0.19"
num-complex = "0.4"

[features]
cuda = ["candle-core/cuda"]
