name: Python Package Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built distributions to PyPI (main only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  release:
    if: ${{ !inputs.publish || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: python -m pip install --upgrade build twine 'cibuildwheel>=3,<4'

    - name: Build source distribution
      run: python -m build --sdist

    - name: Build and test portable Linux wheels
      run: python -m cibuildwheel --output-dir dist
      env:
        CIBW_BUILD: cp310-manylinux_x86_64 cp311-manylinux_x86_64
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        CIBW_BEFORE_ALL_LINUX: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
        CIBW_TEST_COMMAND: python -c "import mentpy; from mentpy import _rust; assert _rust.gf2_inverse([[1,1],[0,1]]) == [[1,1],[0,1]]"

    - name: Validate distribution metadata
      run: python -m twine check --strict dist/*

    - name: Save release distributions
      uses: actions/upload-artifact@v6
      with:
        name: mentpy-distributions
        path: dist/*
        if-no-files-found: error

    - name: Publish the package to PyPI
      if: ${{ inputs.publish }}
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: python -m twine upload --non-interactive dist/*
