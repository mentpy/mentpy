name: Python Package Release

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'setup.cfg'
      - 'mentpy/_native/**'
      - 'tests/wheel_smoke.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built distributions to PyPI (main only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  sdist:
    if: ${{ !inputs.publish || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: python -m pip install --upgrade build twine

    - name: Build source distribution
      run: python -m build --sdist

    - name: Validate distribution metadata
      run: python -m twine check --strict dist/*

    - name: Save release distributions
      uses: actions/upload-artifact@v6
      with:
        name: mentpy-sdist
        path: dist/*
        if-no-files-found: error

  wheels:
    if: ${{ !inputs.publish || github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
          - runner: macos-15
            arch: arm64
            deployment_target: '11.0'
          - runner: macos-15-intel
            arch: x86_64
            deployment_target: '10.12'
          - runner: windows-2025
            arch: AMD64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install wheel builder
      run: python -m pip install --upgrade 'cibuildwheel>=3,<4' twine
    - name: Build and test native wheels
      run: python -m cibuildwheel --output-dir dist
      env:
        # One stable-ABI wheel supports CPython 3.10 and later.
        CIBW_BUILD: cp310-*
        CIBW_SKIP: '*-musllinux*'
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
        CIBW_BEFORE_ALL_LINUX: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
        CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}'
        CIBW_TEST_COMMAND: python {project}/tests/wheel_smoke.py
    - name: Validate distribution metadata
      run: python -m twine check --strict dist/*
    - uses: actions/upload-artifact@v6
      with:
        name: mentpy-wheels-${{ matrix.runner }}
        path: dist/*
        if-no-files-found: error

  publish:
    needs: [sdist, wheels]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v6
      with:
        pattern: mentpy-*
        path: dist
        merge-multiple: true
    - run: python -m pip install --upgrade twine
    - name: Publish the package to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: python -m twine upload --non-interactive dist/*
