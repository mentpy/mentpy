[build-system]
requires = [
    "setuptools>=42",
    "setuptools-rust>=1.8",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "mentpy"
version = "0.1.0a15"
description = "A Python library for simulating MBQC circuits"
readme = "README.md"
authors = [{name = "Luis Mantilla", email = "contact@mentpy.com"}]
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "galois>=0.3.7", 
    "matplotlib>=3.8.2",
    "networkx>=3.2.1",
    "numpy>=1.25.2",
    "pathos>=0.3.1", 
    "PennyLane>=0.33.1",   
    "scikit-learn>=1.3.2", 
    "scipy>=1.11.4" 
]
requires-python = ">=3.9"

[project.optional-dependencies]
jax = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "opt-einsum>=3.3.0"
]
cuda = [
    "jax[cuda12]>=0.6.0; platform_system == 'Linux' and python_version >= '3.10'",
    "opt-einsum>=3.3.0"
]
cuda12 = [
    "jax[cuda12]>=0.6.0; platform_system == 'Linux' and python_version >= '3.10'",
    "opt-einsum>=3.3.0"
]
cudaq = [
    "cudaq>=0.14.2; python_version >= '3.11' and (platform_system == 'Linux' or (platform_system == 'Darwin' and platform_machine == 'arm64'))",
    "cuda-quantum-cu13>=0.14.2; python_version >= '3.11' and (platform_system == 'Linux' or (platform_system == 'Darwin' and platform_machine == 'arm64'))"
]
interop = [
    "cirq-core>=1.3.0",
    "openfermion>=1.6.0",
    "ply>=3.11",
    "qiskit>=1.0"
]
chem = [
    "openfermion>=1.6.0",
    "openfermionpyscf>=0.5",
    "pyscf>=2.5.0"
]
synthesis = [
    "pygridsynth>=2.0.0; python_version >= '3.10'"
]
compiler = [
    "pyzx>=0.10.0"
]
dev = [
    "black>=23.12.0",
    "coverage>=7.3.4",
    "ipykernel>=6.25.2",
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "opt-einsum>=3.3.0",
    "openfermion>=1.6.0",
    "ply>=3.11",
    "pandas>=2.1.4",
    "pickleshare>=0.7.5",
    "pyarrow>=15.0.0",
    "pyzx>=0.10.0",
    "pytest>=7.4.2",
    "Sphinx>=7.2.6",
    "sphinx_immaterial>=0.11.10"
]

[tool.setuptools.packages.find]
include = ["mentpy*"]

[[tool.setuptools-rust.ext-modules]]
target = "mentpy._rust"
path = "Cargo.toml"
binding = "PyO3"
optional = true
